name: CI

# run-name 说明:
# - 手动触发(workflow_dispatch): 显示 "Build Rust {版本} for OHOS"
# - 其他触发方式: 返回空字符串，GitHub 使用默认显示规则
#   - PR: 显示 PR 标题
#   - Push: 显示 commit 标题
#   - Release: 显示 release tag name
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Build Rust
  {0} for OHOS', github.event.inputs.rust_version_select == 'custom' &&
  github.event.inputs.rust_version_custom ||
  github.event.inputs.rust_version_select || '1.95.0') || '' }}"

on:
  release:
    types: [ published ]
  push:
    branches: [ "main", "nightly" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN mode (skip compilation, generate mock artifacts only)"
        required: false
        default: false
        type: boolean
      clean_build:
        description: "Clean build (remove source and rebuild from scratch)"
        required: false
        default: true
        type: boolean
      rust_version_select:
        description: "Rust version (select from list)"
        required: false
        default: "1.95.0"
        type: choice
        options:
          - "1.95.0"
          - "1.89.0"
          - "custom"
      rust_version_custom:
        description: "Custom Rust version (only used when \"custom\" is selected above,
          e.g., 1.90.0)"
        required: false
        default: ""
        type: string

permissions: write-all

jobs:
  build-on-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      rust_version: ${{ steps.version.outputs.rust_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Rust version
        id: version
        run: |
          SELECT="${{ github.event.inputs.rust_version_select || '1.95.0' }}"
          CUSTOM="${{ github.event.inputs.rust_version_custom || '' }}"

          case "$SELECT" in
            'custom')
              if [ -z "$CUSTOM" ]; then
                echo "Error: custom version selected but no custom version provided"
                exit 1
              fi
              RUST_VER="$CUSTOM"
              ;;
            *)
              RUST_VER="$SELECT"
              ;;
          esac

          # Determine channel from branch (nightly branch → nightly channel)
          if [ "${{ github.ref_name }}" = "nightly" ]; then
            CHANNEL="nightly"
          else
            CHANNEL="stable"
          fi

          # Construct release string: stable → "1.95.0", nightly → "1.95.0-nightly"
          # PKG_VERSION is used for tarball naming: stable → "1.95.0", nightly → "nightly"
          if [ "$CHANNEL" = "stable" ]; then
            RELEASE="$RUST_VER"
            PKG_VERSION="$RUST_VER"
          else
            RELEASE="$RUST_VER-$CHANNEL"
            PKG_VERSION="$CHANNEL"
          fi

          echo "rust_version=$RUST_VER" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "pkg_version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "=== Building Rust version: $RUST_VER (channel: $CHANNEL, release: $RELEASE) ==="

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-x86_64-${{ hashFiles('x86_64/Dockerfile',
            'x86_64/scripts/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-docker-x86_64-

      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: x86_64/Dockerfile
          push: false
          load: true
          tags: rust-ohos-x86_64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ steps.version.outputs.rust_version }}-${{ hashFiles('patches/**/*.patch') }}
          restore-keys: |
            sccache-${{ steps.version.outputs.rust_version }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ steps.version.outputs.rust_version }}-${{ hashFiles('patches/**/*.patch') }}
          restore-keys: |
            ccache-${{ steps.version.outputs.rust_version }}-

      - name: Build
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          CLEAN_BUILD="${{ github.event.inputs.clean_build || 'true' }}"
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DRY_RUN="$DRY_RUN" \
            -e CLEAN_BUILD="$CLEAN_BUILD" \
            -e RUST_VERSION="${{ steps.version.outputs.rust_version }}" \
            -e CHANNEL="${{ steps.version.outputs.channel }}" \
            -e SCCACHE_CACHE_SIZE=5G \
            rust-ohos-x86_64 ./x86_64/build.sh

      - name: Stop sccache server
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            rust-ohos-x86_64 sccache --stop-server 2>/dev/null || true

      # 1. 上传全家桶
      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/rust-${{ steps.version.outputs.pkg_version
            }}-aarch64-unknown-linux-ohos.tar.gz
          name: rust-${{ steps.version.outputs.pkg_version
            }}-aarch64-unknown-linux-ohos-cross
          retention-days: 90

      # 2. 上传独立 rust-analyzer
      - name: Upload rust-analyzer artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/rust-analyzer-${{
            steps.version.outputs.pkg_version
            }}-aarch64-unknown-linux-ohos.tar.gz
          name: rust-analyzer-${{ steps.version.outputs.pkg_version
            }}-aarch64-unknown-linux-ohos-cross
          retention-days: 90

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            ${{ github.workspace }}/rust-${{ steps.version.outputs.pkg_version }}-aarch64-unknown-linux-ohos.tar.gz
            ${{ github.workspace }}/rust-analyzer-${{ steps.version.outputs.pkg_version }}-aarch64-unknown-linux-ohos.tar.gz
