name: CI

run-name: "${{ github.event_name == 'workflow_dispatch' && format('Build Rust
  {0} ({1}) for OHOS', github.event.inputs.rust_version_select == 'custom' &&
  github.event.inputs.rust_version_custom ||
  github.event.inputs.rust_version_select ||
  (github.event.inputs.channel == 'nightly' && '1.100.0') || '1.95.0',
  github.event.inputs.channel || 'stable') || '' }}"

on:
  release:
    types: [ published ]
  push:
    branches: [ "main", "1.89.0", "nightly" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: "stable"
        type: choice
        options:
          - "stable"
          - "nightly"
      dry_run:
        description: "DRY_RUN mode (skip compilation, generate mock artifacts only)"
        required: false
        default: false
        type: boolean
      clean_build:
        description: "Clean build (remove source and rebuild from scratch)"
        required: false
        default: true
        type: boolean
      rust_version_select:
        description: "Rust version (nightly channel defaults to 1.100.0)"
        required: false
        default: "1.95.0"
        type: choice
        options:
          - "1.95.0"
          - "1.100.0"
          - "1.89.0"
          - "custom"
      rust_version_custom:
        description: "Custom Rust version (only used when \"custom\" is selected above)"
        required: false
        default: ""
        type: string

permissions: write-all

jobs:
  build-on-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      rust_version: ${{ steps.version.outputs.rust_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Rust version and channel
        id: version
        run: |
          # workflow_dispatch: use inputs
          # push: derive from branch name
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
            SELECT="${{ github.event.inputs.rust_version_select || '1.95.0' }}"
            CUSTOM="${{ github.event.inputs.rust_version_custom || '' }}"

            # Nightly channel defaults to 1.100.0 if version not explicitly set
            if [ "$CHANNEL" = "nightly" ] && [ "$SELECT" = "1.95.0" ]; then
              SELECT="1.100.0"
            fi
          else
            # Push/PR: derive from branch name
            BRANCH="${{ github.ref_name }}"
            case "$BRANCH" in
              1.89.0)
                CHANNEL="stable"
                SELECT="1.89.0"
                ;;
              nightly)
                CHANNEL="nightly"
                SELECT="1.100.0"
                ;;
              *)
                CHANNEL="stable"
                SELECT="1.95.0"
                ;;
            esac
            CUSTOM=""
          fi

          case "$SELECT" in
            'custom')
              if [ -z "$CUSTOM" ]; then
                echo "Error: custom version selected but no custom version provided"
                exit 1
              fi
              RUST_VER="$CUSTOM"
              ;;
            *)
              RUST_VER="$SELECT"
              ;;
          esac

          if [ "$CHANNEL" = "stable" ]; then
            RELEASE="$RUST_VER"
            PKG_VERSION="$RUST_VER"
          else
            RELEASE="$RUST_VER-$CHANNEL"
            PKG_VERSION="$CHANNEL"
          fi

          echo "rust_version=$RUST_VER" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "pkg_version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          # Nightly source uses dated tarball (version tarball doesn't exist)
          if [ "$CHANNEL" = "nightly" ]; then
            NIGHTLY_DATE="${{ github.event.inputs.nightly_date || '' }}"
            if [ -z "$NIGHTLY_DATE" ]; then
              # Derive date from branch name for nightly branch (e.g. nightly → 2026-08-20)
              NIGHTLY_DATE="2026-08-20"
            fi
          else
            NIGHTLY_DATE=""
          fi
          echo "nightly_date=$NIGHTLY_DATE" >> $GITHUB_OUTPUT
          echo "=== Building Rust version: $RUST_VER (channel: $CHANNEL, release: $RELEASE, nightly_date: $NIGHTLY_DATE) ==="

      - name: Build Docker image
        run: |
          docker build -f x86_64/Dockerfile -t rust-ohos-x86_64 .
          echo "=== Docker images ==="
          docker images | grep rust-ohos

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ steps.version.outputs.rust_version }}-${{ hashFiles('patches/**/*.patch') }}
          restore-keys: |
            sccache-${{ steps.version.outputs.rust_version }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ steps.version.outputs.rust_version }}-${{ hashFiles('patches/**/*.patch') }}
          restore-keys: |
            ccache-${{ steps.version.outputs.rust_version }}-

      - name: Build
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          CLEAN_BUILD="${{ github.event.inputs.clean_build || 'true' }}"
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DRY_RUN="$DRY_RUN" \
            -e CLEAN_BUILD="$CLEAN_BUILD" \
            -e RUST_VERSION="${{ steps.version.outputs.rust_version }}" \
            -e CHANNEL="${{ steps.version.outputs.channel }}" \
            -e NIGHTLY_DATE="${{ steps.version.outputs.nightly_date }}" \
            -e SCCACHE_CACHE_SIZE=5G \
            rust-ohos-x86_64 ./x86_64/build.sh

      - name: Stop sccache server
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            rust-ohos-x86_64 sccache --stop-server 2>/dev/null || true

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/rust-${{ steps.version.outputs.pkg_version
            }}-aarch64-unknown-linux-ohos.tar.gz
          name: rust-${{ steps.version.outputs.pkg_version
            }}-aarch64-unknown-linux-ohos-cross
          retention-days: 90

      - name: Upload rust-analyzer artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/rust-analyzer-${{
            steps.version.outputs.pkg_version
            }}-aarch64-unknown-linux-ohos.tar.gz
          name: rust-analyzer-${{ steps.version.outputs.pkg_version
            }}-aarch64-unknown-linux-ohos-cross
          retention-days: 90

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            ${{ github.workspace }}/rust-${{ steps.version.outputs.pkg_version }}-aarch64-unknown-linux-ohos.tar.gz
            ${{ github.workspace }}/rust-analyzer-${{ steps.version.outputs.pkg_version }}-aarch64-unknown-linux-ohos.tar.gz
